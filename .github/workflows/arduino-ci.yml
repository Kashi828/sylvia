name: SYLVIA Arduino CI

on:
  push:
    branches: [main]
    paths:
      - "arduino/**"
      - ".github/workflows/arduino-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "arduino/**"
      - ".github/workflows/arduino-ci.yml"

jobs:
  esp8266-cloud-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP8266 package index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index

      - name: Install ESP8266 core
        run: arduino-cli core install esp8266:esp8266

      - name: Install ArduinoJson
        run: arduino-cli lib install ArduinoJson

      - name: Install local Sylvia library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          rm -rf "$HOME/Arduino/libraries/Sylvia"
          cp -R arduino/Sylvia "$HOME/Arduino/libraries/Sylvia"

      - name: Compile ESP8266 Cloud Test
        run: |
          arduino-cli compile             --fqbn esp8266:esp8266:nodemcuv2             arduino/Sylvia/examples/ESP8266_Cloud_Test
